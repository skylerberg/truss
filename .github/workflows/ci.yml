name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ocaml/setup-ocaml@v3.9.1
        with:
          ocaml-compiler: 5.5.2

      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup --yes

      # The prover is pinned to one Z3 release, since another could answer
      # differently. See PROVER.md, "The solver".
      - name: Install Z3 5.3.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/z3.zip" https://github.com/Z3Prover/z3/releases/download/z3-5.3.3/z3-5.3.3-x64-glibc-2.39.zip
          echo "d56f60b06f432f33de5810f7f1a384a339131f361e2d54d08ea83eea14326880  $RUNNER_TEMP/z3.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/z3-5.3.3-x64-glibc-2.39/bin" >> "$GITHUB_PATH"

      - name: Build
        run: opam exec -- dune build

      - name: Check formatting
        run: opam exec -- dune build @fmt

      - name: Check that truss.opam matches dune-project
        run: opam exec -- dune build @install

      - name: Test
        run: opam exec -- dune test

      # Every codegen test again, with its C built under AddressSanitizer
      # and UndefinedBehaviorSanitizer: a report is a compiler bug. Leaks
      # are left to the test runner's own count of live blocks, since the
      # runner itself frees nothing at exit.
      - name: Test generated code under sanitizers
        env:
          TRUSS_SANITIZE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: opam exec -- dune test --force stage0/test/codegen
