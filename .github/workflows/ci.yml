name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run it replaces. Each push to
# main runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  OPAM_VERSION: 2.6.1
  OPAM_SHA256: b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d
  OCAML_VERSION: 5.5.2
  DUNE_CACHE: enabled

jobs:
  # The build, the formatting, the opam file, and every test, in one dune
  # run so that they overlap.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      # Pull requests start from main's dune cache, so they build only what
      # they changed.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - name: Build, check formatting and truss.opam, and test
        run: opam exec -- dune build @default @install @fmt @runtest

      - name: Check that truss.opam matches dune-project
        run: git diff --exit-code truss.opam

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}

  # Every codegen test again, with its C built under AddressSanitizer and
  # UndefinedBehaviorSanitizer: a report is a compiler bug. Leaks are left to
  # the test runner's own count of live blocks, since the runner itself
  # frees nothing at exit. It runs beside the check, on a runner of its own.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - name: Test generated code under sanitizers
        env:
          TRUSS_SANITIZE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: opam exec -- dune test --force stage0/test/codegen
