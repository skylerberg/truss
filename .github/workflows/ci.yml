name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  OPAM_VERSION: 2.6.1
  OPAM_SHA256: b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d
  OCAML_VERSION: 5.5.2
  DUNE_CACHE: enabled

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check that only tests and tools use For_testing
        run: .github/scripts/for_testing.sh

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - uses: ./.github/actions/z3

      - name: Build, check formatting and truss.opam, and test the compiler
        env:
          TRUSS_SKIP_SUITES: standard_library_tests,prover_tests
        run: opam exec -- dune build @default @install @fmt @@stage0/test/runtest @stage0/test/cli/runtest

      - name: Check that truss.opam matches dune-project
        run: git diff --exit-code truss.opam

      - name: Check that no file has a comment
        run: git ls-files -z | xargs -0 ./_build/default/stage0/tools/comments/comments.exe

      - name: Check that code names each module by its path
        run: git ls-files -z '*.ml' '*.mli' | xargs -0 ./_build/default/stage0/tools/qualified_names/qualified_names.exe

      - if: github.event_name == 'push'
        run: opam exec -- dune cache trim --size=200MB

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}

  prover-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - uses: ./.github/actions/z3

      - name: Test the prover
        run: |
          opam exec -- dune build ./stage0/test/prover_tests.exe
          cd _build/default/stage0/test
          "$GITHUB_WORKSPACE/.github/scripts/test-shares.sh" 4 ./prover_tests.exe

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - uses: ./.github/actions/z3

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss/caches/objects
          key: objects-${{ github.sha }}
          restore-keys: objects-

      - name: Test generated code
        run: |
          touch "$RUNNER_TEMP/test-start"
          opam exec -- dune build @stage0/test/codegen/runtest

      - name: Remove objects that the tests did not use
        run: find ~/.cache/truss/caches/objects -type f ! -newer "$RUNNER_TEMP/test-start" -delete

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss/caches/objects
          key: objects-${{ github.sha }}

  proofs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        share: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - uses: ./.github/actions/z3

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss-proofs
          key: proofs-share-${{ matrix.share }}-${{ github.sha }}
          restore-keys: |
            proofs-share-${{ matrix.share }}-
            proofs-

      - name: Prove a share of the standard library
        env:
          TRUSS_CACHE: /home/runner/.cache/truss-proofs
          TRUSS_CACHE_SIZE: 104857600
        run: |
          opam exec -- dune build ./stage0/test/standard_library_tests.exe
          cd _build/default/stage0/test
          "$GITHUB_WORKSPACE/.github/scripts/prove-share.sh" ${{ matrix.share }} ${{ strategy.job-total }}

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss-proofs
          key: proofs-share-${{ matrix.share }}-${{ github.sha }}

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss/caches/objects
          key: thread-sanitized-objects-${{ github.sha }}
          restore-keys: thread-sanitized-objects-

      - name: Test programs on threads under ThreadSanitizer
        env:
          TRUSS_CFLAGS: -fsanitize=thread -fno-omit-frame-pointer
        run: |
          touch "$RUNNER_TEMP/test-start"
          opam exec -- dune build stage0/test/codegen/parallel_tests.exe stage0/test/codegen/shared_tests.exe stage0/test/codegen/concurrent_tests.exe
          cd _build/default/stage0/test/codegen
          ./parallel_tests.exe
          TRUSS_TEST="on threads" ./shared_tests.exe
          TRUSS_TEST="on threads" ./concurrent_tests.exe

      - name: Remove objects that the tests did not use
        run: find ~/.cache/truss/caches/objects -type f ! -newer "$RUNNER_TEMP/test-start" -delete

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss/caches/objects
          key: thread-sanitized-objects-${{ github.sha }}
