name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run it replaces. Each push to
# main runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  OPAM_VERSION: 2.6.1
  OPAM_SHA256: b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d
  OCAML_VERSION: 5.5.2
  DUNE_CACHE: enabled

jobs:
  # The build, the formatting, the opam file, and the compiler's tests, in
  # one dune run so that they overlap. The tests of generated code and the
  # standard library's proofs run in jobs of their own.
  check:
    runs-on: ubuntu-latest
    steps:
      # The history is for the step below, which reads the last merges.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 40

      # A branch squashed onto a main that moved takes merged work out with
      # no conflict, so it is caught here, before anything is built.
      - name: Check that no recent merge is taken out
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'Revert')
        run: .github/scripts/reverts.sh

      - name: Check that only tests and tools use For_testing
        run: .github/scripts/for_testing.sh

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      # Pull requests start from main's dune cache, so they build only what
      # they changed.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - uses: ./.github/actions/z3

      # `@@` names the tests of one directory without its subdirectories,
      # which leaves out stage0/test/codegen.
      - name: Build, check formatting and truss.opam, and test the compiler
        env:
          TRUSS_SKIP_LIBRARY_PROOFS: "1"
        run: opam exec -- dune build @default @install @fmt @@stage0/test/runtest @stage0/test/cli/runtest @grammar/runtest

      - name: Check that truss.opam matches dune-project
        run: git diff --exit-code truss.opam

      # Each save starts from the last one, so the cache is trimmed to keep it
      # quick to restore.
      - if: github.event_name == 'push'
        run: opam exec -- dune cache trim --size=200MB

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}

  # The tests of generated code, which compile and run C: the longest tests
  # after the proofs, so they run beside the check, on a runner of their own.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      # The codegen tests include running the prover on templates.
      - uses: ./.github/actions/z3

      # The objects of the C that the tests generate, each kept by the text
      # of its C, the compiler, and its flags. A run starts from main's and
      # compiles only the C that main did not.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss-objects
          key: objects-${{ github.sha }}
          restore-keys: objects-

      - name: Test generated code
        run: TRUSS_OBJECT_CACHE="$HOME/.cache/truss-objects" opam exec -- dune build @stage0/test/codegen/runtest

      # An object compiled more than two weeks ago is dropped, and compiled
      # again by the next run that needs it, so the cache holds the objects
      # that are still built and not every one that was.
      - if: github.event_name == 'push'
        run: mkdir -p ~/.cache/truss-objects && find ~/.cache/truss-objects -type f -mtime +14 -delete

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss-objects
          key: objects-${{ github.sha }}

  # The standard library's proofs: the longest test, and the one that grows
  # with the library, so it runs beside the check, dealt out to several
  # runners. Each proves its share of the modules. A new share is one more
  # entry in the list.
  proofs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        share: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      - uses: ./.github/actions/z3

      # The solver's answers, each kept by the text of its query, the
      # solver's version, and its limit. A run starts from main's and solves
      # only the queries main did not. Each share keeps its own answers, and
      # one with none yet starts from any share's, which is how a new share
      # begins with the answers of the ones it was split from.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss-solver
          key: solver-share-${{ matrix.share }}-${{ github.sha }}
          restore-keys: |
            solver-share-${{ matrix.share }}-
            solver-

      # The state the last run on main saved for this share, kept in the
      # code database's store, so that a run recomputes only the dependents
      # of an edit to the library. A state is read only by the compiler that wrote it,
      # so the key names the compiler's sources, and a change to them starts
      # from nothing and leaves the old states behind.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss-proofs
          key: proofs-share-${{ matrix.share }}-${{ hashFiles('stage0/**', '!stage0/test/**', '!stage0/tools/**', 'dune-project') }}-${{ github.sha }}
          restore-keys: proofs-share-${{ matrix.share }}-${{ hashFiles('stage0/**', '!stage0/test/**', '!stage0/tools/**', 'dune-project') }}-

      - name: Prove a share of the standard library
        run: |
          opam exec -- dune build ./stage0/test/standard_library_tests.exe
          cd _build/default/stage0/test
          TRUSS_PROOF_SHARE="${{ matrix.share }}/${{ strategy.job-total }}" TRUSS_SOLVER_CACHE="$HOME/.cache/truss-solver" TRUSS_CACHE="$HOME/.cache/truss-proofs" TRUSS_PROOF_STATE="share-${{ matrix.share }}" ./standard_library_tests.exe

      # An answer no run has asked for in two weeks is dropped, so the cache
      # holds the queries that are still asked and not every one that was. A
      # run gives each answer it finds the present time.
      - if: github.event_name == 'push'
        run: mkdir -p ~/.cache/truss-solver && find ~/.cache/truss-solver -type f -mtime +14 -delete

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss-solver
          key: solver-share-${{ matrix.share }}-${{ github.sha }}

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss-proofs
          key: proofs-share-${{ matrix.share }}-${{ hashFiles('stage0/**', '!stage0/test/**', '!stage0/tools/**', 'dune-project') }}-${{ github.sha }}

  # Every codegen test again, with its C built under AddressSanitizer and
  # UndefinedBehaviorSanitizer: a report is a compiler bug. Leaks are left to
  # the test runner's own count of live blocks, since the runner itself
  # frees nothing at exit. It runs beside the check, on a runner of its own.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      # The codegen tests include running the prover on templates.
      - uses: ./.github/actions/z3

      # The sanitizers' flags are part of an object's key, so these objects
      # are this job's own. A restore takes the newest cache whose name
      # starts with its key, so this cache's name must not start with the
      # check's, or the check restores these objects and compiles every one
      # of its own again.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss-objects
          key: sanitized-objects-${{ github.sha }}
          restore-keys: sanitized-objects-

      - name: Test generated code under sanitizers
        env:
          TRUSS_SANITIZE: "1"
          ASAN_OPTIONS: detect_leaks=0
        run: TRUSS_OBJECT_CACHE="$HOME/.cache/truss-objects" opam exec -- dune test --force stage0/test/codegen

      - if: github.event_name == 'push'
        run: mkdir -p ~/.cache/truss-objects && find ~/.cache/truss-objects -type f -mtime +14 -delete

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss-objects
          key: sanitized-objects-${{ github.sha }}

  # The programs that run on several threads, again under ThreadSanitizer,
  # which the other sanitizers cannot run beside: a report is a data race in
  # the runtime or in generated code. The tests of tasks and shared values
  # that run on threads have "on threads" in their names. These tests take
  # as long as the other sanitizers' do, so they run on a runner of their
  # own. None of them runs the prover, so the job installs no solver.
  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - id: opam
        uses: ./.github/actions/opam
        with:
          opam-version: ${{ env.OPAM_VERSION }}
          opam-sha256: ${{ env.OPAM_SHA256 }}
          ocaml-version: ${{ env.OCAML_VERSION }}

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ steps.opam.outputs.key }}-${{ github.sha }}
          restore-keys: dune-${{ steps.opam.outputs.key }}-

      # ThreadSanitizer's flag is part of an object's key, so these objects
      # are this job's own. A run with no cache of this job's yet starts
      # from the other sanitizers', which held these objects while the two
      # were one job.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/truss-objects
          key: thread-sanitized-objects-${{ github.sha }}
          restore-keys: |
            thread-sanitized-objects-
            sanitized-objects-

      - name: Test programs on threads under ThreadSanitizer
        env:
          TRUSS_SANITIZE: thread
          TRUSS_OBJECT_CACHE: /home/runner/.cache/truss-objects
        run: |
          opam exec -- dune build stage0/test/codegen/parallel_tests.exe stage0/test/codegen/shared_tests.exe stage0/test/codegen/concurrent_tests.exe
          cd _build/default/stage0/test/codegen
          ./parallel_tests.exe
          TRUSS_TEST="on threads" ./shared_tests.exe
          TRUSS_TEST="on threads" ./concurrent_tests.exe

      - if: github.event_name == 'push'
        run: mkdir -p ~/.cache/truss-objects && find ~/.cache/truss-objects -type f -mtime +14 -delete

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/truss-objects
          key: thread-sanitized-objects-${{ github.sha }}
