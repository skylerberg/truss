name: Change summary

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: change-summary-${{ github.event.pull_request.number }}

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    if: >-
      github.event.pull_request.state == 'open'
      && (github.event.action != 'edited' || github.event.changes.body)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Write the change summary into the description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "refs/pull/$PULL_REQUEST/head"
          .github/scripts/change_summary.py "origin/$BASE_REF" FETCH_HEAD --pull-request "$PULL_REQUEST"
