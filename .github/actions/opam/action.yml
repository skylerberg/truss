name: OCaml and the dependencies
description: >
  Restores opam with the OCaml switch and every dependency already built,
  from a cache keyed by the opam and OCaml versions, the runner's image, and
  truss.opam. When truss.opam changed, it starts from the newest cache with
  the same opam, OCaml, and image, and installs only what changed, so a new
  dependency costs what building it costs. Only a new opam, OCaml, or image
  builds the switch from nothing: the opam binary is downloaded and checked
  against its pinned hash. Nothing comes from apt, so a slow package mirror
  cannot slow a run.

inputs:
  opam-version:
    required: true
  opam-sha256:
    required: true
  ocaml-version:
    required: true

outputs:
  key:
    description: The cache key, which the dune cache's key starts with
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        base="opam-${{ runner.os }}-${{ runner.arch }}-${ImageOS}-${{ inputs.opam-version }}-${{ inputs.ocaml-version }}-"
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "key=$base${{ hashFiles('truss.opam') }}" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          ~/.opam
          ~/.local/bin/opam
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.base }}

    # Nothing restored: opam, the switch, and every dependency from nothing.
    - if: steps.restore.outputs.cache-matched-key == ''
      shell: bash
      env:
        OPAMYES: "1"
      run: |
        mkdir -p ~/.local/bin
        curl -fsSL -o ~/.local/bin/opam \
          "https://github.com/ocaml/opam/releases/download/${{ inputs.opam-version }}/opam-${{ inputs.opam-version }}-x86_64-linux"
        echo "${{ inputs.opam-sha256 }}  $HOME/.local/bin/opam" | sha256sum --check
        chmod +x ~/.local/bin/opam
        ~/.local/bin/opam init --bare --disable-sandboxing --no-setup
        ~/.local/bin/opam switch create default "ocaml-base-compiler.${{ inputs.ocaml-version }}"

    # Anything but an exact match: the dependencies truss.opam asks for now.
    # A restored switch's package list is brought up to date first, so that a
    # version released since it was made can be installed.
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        OPAMYES: "1"
      run: |
        if [ -n "${{ steps.restore.outputs.cache-matched-key }}" ]; then
          ~/.local/bin/opam update --repositories
        fi
        ~/.local/bin/opam install . --deps-only --with-test --with-dev-setup
        ~/.local/bin/opam clean --all-switches --download-cache --logs

    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: |
          ~/.opam
          ~/.local/bin/opam
        key: ${{ steps.key.outputs.key }}

    - shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
